name: Build Driver

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and export libfprint shared library
        run: |
          docker build --target artifacts --output dist -f build/Containerfile.builder .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfprint-2.so.2.0.0-x86_64
          path: dist/libfprint-2.so.2.0.0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/libfprint-2.so.2.0.0
