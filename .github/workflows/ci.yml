name: Build Driver

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build libfprint shared library
        run: |
          docker build -t fprint-builder -f build/Containerfile.builder .
          CONTAINER_ID=$(docker create fprint-builder)
          mkdir -p dist
          docker cp "$CONTAINER_ID":/libfprint-2.so.2.0.0 dist/libfprint-2.so.2.0.0
          docker rm "$CONTAINER_ID"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfprint-2.so.2.0.0-x86_64
          path: dist/libfprint-2.so.2.0.0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/libfprint-2.so.2.0.0
